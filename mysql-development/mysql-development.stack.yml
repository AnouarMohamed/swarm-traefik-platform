version: '3.8'

services:
  db:
    image: mysql:8.3@sha256:9de9d54fecee6253130e65154b930978b1fcc336bcc86dfd06e89b72a2588ebe
    deploy:
      replicas: 1
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/MYSQL_DEV_ROOT_PASSWORD
    volumes:
      - mysql-development:/var/lib/mysql
    networks:
      - mysql-development
    secrets:
      - MYSQL_DEV_ROOT_PASSWORD
    # Do not bypass the edge by publishing a database port on every Swarm node.
    # Use an authenticated SSH tunnel or `docker exec` for maintenance access.

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2.1@sha256:44328e7738eb732bed34fa2dd10c0e4683cbf0b87c23be2f660ea8ccfc271942
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.phpmyadmin-dev.rule=Host(`db-development.example.com`)"
        - "traefik.http.services.phpmyadmin-dev.loadbalancer.server.port=80"
        - "traefik.http.routers.phpmyadmin-dev.tls=true"
        - "traefik.http.routers.phpmyadmin-dev.tls.certresolver=leresolver"
        - "traefik.http.routers.phpmyadmin-dev.middlewares=authinfra"
        - "traefik.http.routers.phpmyadmin-dev.entrypoints=websecure"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 300M
    networks:
      - edge-net
      - mysql-development


volumes:
  mysql-development:
    external: true

networks:
  edge-net:
    external: true
  mysql-development:
    external: true

secrets:
  MYSQL_DEV_ROOT_PASSWORD:
    external: true
