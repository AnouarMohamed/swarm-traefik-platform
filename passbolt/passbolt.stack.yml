version: "3.9"

services:
  passbolt-db:
    image: mariadb:10.11@sha256:ce66c7be32a03aabe7241d0a10993a2db827ef652a35d25727d92a832ac8ef73
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "true"
      MYSQL_DATABASE_FILE: /run/secrets/PASSBOLT_DB_DATABASE
      MYSQL_USER_FILE: /run/secrets/PASSBOLT_DB_USER
      MYSQL_PASSWORD_FILE: /run/secrets/PASSBOLT_DB_PASSWORD
    volumes:
      - database_vol:/var/lib/mysql
    networks:
      - stack-net
    secrets:
      - PASSBOLT_DB_DATABASE
      - PASSBOLT_DB_USER
      - PASSBOLT_DB_PASSWORD

  passbolt:
    image: passbolt/passbolt:4.9.0-1-ce-non-root@sha256:82ac9c7682f1c07e89e0dc212c049c4ba40adaf92326d232f6281724abfa37e9
    depends_on:
      - passbolt-db
    environment:
      APP_FULL_BASE_URL: https://passbolt.example.com
      DATASOURCES_DEFAULT_HOST: "passbolt-db"
      DATASOURCES_DEFAULT_DATABASE_FILE: /run/secrets/PASSBOLT_DB_DATABASE
      DATASOURCES_DEFAULT_USERNAME_FILE: /run/secrets/PASSBOLT_DB_USER
      DATASOURCES_DEFAULT_PASSWORD_FILE: /run/secrets/PASSBOLT_DB_PASSWORD
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.passbolt.rule=Host(`passbolt.example.com`)"
        - "traefik.http.routers.passbolt.tls=true"
        - "traefik.http.routers.passbolt.tls.certresolver=leresolver"
        - "traefik.http.routers.passbolt.entrypoints=websecure"
        - "traefik.http.routers.passbolt.middlewares=infra-ratelimit,infra-compress"
        - "traefik.http.services.passbolt.loadbalancer.server.port=8080"
    volumes:
      - gpg_vol:/etc/passbolt/gpg
      - jwt_vol:/etc/passbolt/jwt
    command:
      [
        "/usr/bin/wait-for.sh",
        "-t",
        "0",
        "passbolt-db:3306",
        "--",
        "/docker-entrypoint.sh",
      ]
    networks:
      - edge-net
      - stack-net
    secrets:
      - PASSBOLT_DB_DATABASE
      - PASSBOLT_DB_USER
      - PASSBOLT_DB_PASSWORD

volumes:
  database_vol:
  gpg_vol:
  jwt_vol:

networks:
  edge-net:
    external: true
  stack-net:
    external: false

secrets:
  PASSBOLT_DB_PASSWORD:
    external: true
  PASSBOLT_DB_USER:
    external: true
  PASSBOLT_DB_DATABASE:
    external: true
