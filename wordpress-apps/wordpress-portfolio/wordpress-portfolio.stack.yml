version: '3.8'

services:
  wp:
    image: registry.example.com/platform/wordpress:6.9.2-php8.3-r1
    env_file:
      - .env
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.wordpress-portfolio-wp.rule=Host(`wordpress-portfolio.example.com`)"
        - "traefik.http.services.wordpress-portfolio-wp.loadbalancer.server.port=80"
        - "traefik.http.routers.wordpress-portfolio-wp.tls=true"
        - "traefik.http.routers.wordpress-portfolio-wp.tls.certresolver=leresolver"
        - "traefik.http.routers.wordpress-portfolio-wp.entrypoints=websecure"
        - "traefik.http.routers.wordpress-portfolio-wp.middlewares=infra-compress"
    volumes:
      - wordpress-portfolio:/var/www/html
    networks:
      - edge-net
      - mysql-net


volumes:
  wordpress-portfolio:
    external: true

networks:
  edge-net:
    external: true
  mysql-net:
    external: true
