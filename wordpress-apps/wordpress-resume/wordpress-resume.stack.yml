version: '3.8'

services:
  wp:
    image: registry.example.com/platform/wordpress:6.9.2-php8.3-r1
    env_file:
      - .env
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.wordpress-resume-wp.rule=Host(`wordpress-resume.example.com`)"
        - "traefik.http.services.wordpress-resume-wp.loadbalancer.server.port=80"
        - "traefik.http.routers.wordpress-resume-wp.tls=true"
        - "traefik.http.routers.wordpress-resume-wp.tls.certresolver=leresolver"
        - "traefik.http.routers.wordpress-resume-wp.entrypoints=websecure"
    volumes:
      - wordpress-resume:/var/www/html
    networks:
      - edge-net
      - mysql-net


volumes:
  wordpress-resume:
    external: true

networks:
  edge-net:
    external: true
  mysql-net:
    external: true
