version: '3.8'

services:
  agent:
    image: portainer/agent:2.21.0@sha256:22787d20fd7c432a725ba19e8f2c95afcf06cfb7e7b4839fe0fa20ed0196ab83
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - agent_network
    deploy:
      mode: global
      placement:
        constraints: [node.platform.os == linux]

  portainer:
    image: portainer/portainer-ce:2.21.0@sha256:a5e6d58c93bea2988b604f9c9b1afaa30dc213532dfd9beb7774429146276604
    command: -H tcp://tasks.agent:9001 --tlsskipverify

    # The UI is exposed only through Traefik. Direct host ports would bypass
    # the edge authentication, rate limiting and certificate policy.
    volumes:
      - portainer_data:/data
    networks:
      - agent_network
      - edge-net
    deploy:
      labels:
        - "traefik.enable=true"

        - "traefik.http.routers.portainer.rule=Host(`portainer.example.com`)"
        - "traefik.http.services.portainer.loadbalancer.server.port=9000"
        - "traefik.http.routers.portainer.tls=true"
        - "traefik.http.routers.portainer.tls.certresolver=leresolver"
        - "traefik.http.routers.portainer.entrypoints=websecure"
        - "traefik.http.routers.portainer.middlewares=infra-ratelimit"

      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]

networks:
  agent_network:
    driver: overlay
    attachable: true
  edge-net:
    external: true

volumes:
  portainer_data:
