version: '3.8'

services:
  jenkins:
    image: jenkins/jenkins:jdk17@sha256:763df2c359d15effa4a05fdcb61a1aef3fda80aa5c6a9c04a9f26be48b01fb20
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.jenkins.rule=Host(`jenkins.example.com`)"
        - "traefik.http.routers.jenkins.tls=true"
        - "traefik.http.routers.jenkins.tls.certresolver=leresolver"
        - "traefik.http.routers.jenkins.middlewares=authinfra"
        - "traefik.http.routers.jenkins.entrypoints=websecure"
        - "traefik.http.services.jenkins.loadbalancer.server.port=8080"
    volumes:
      - jenkins-home:/var/jenkins_home
    networks:
      - edge-net

volumes:
  jenkins-home:
    external: true

networks:
  edge-net:
    external: true
